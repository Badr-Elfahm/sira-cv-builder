const blank=()=>({version:2,contentLang:'ar',template:'modern',themeColor:'#176b5b',density:'normal',personal:Object.fromEntries(personalKeys.map(k=>[k,''])),...Object.fromEntries(lists.map(k=>[k,[]]))});

function normalize(x){if(!x||typeof x!=='object'||!x.personal||typeof x.personal!=='object'||Array.isArray(x.personal))throw Error('invalid');const d=blank();d.contentLang=['ar','en','fr'].includes(x.contentLang)?x.contentLang:'ar';d.template=TEMPLATE_CATALOG.some(v=>v.id===x.template)?x.template:'modern';d.themeColor=/^#[0-9a-f]{6}$/i.test(x.themeColor)?x.themeColor:d.themeColor;d.density=x.density==='compact'?'compact':'normal';for(const k of personalKeys)d.personal[k]=typeof x.personal[k]==='string'?x.personal[k]:'';if(!/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(d.personal.photo))d.personal.photo='';for(const k of lists){if(x[k]!=null&&!Array.isArray(x[k]))throw Error('invalid');d[k]=(x[k]||[]).filter(v=>v&&typeof v==='object').map(v=>{const out={};for(const f of ['company','role','expYear','desc','school','degree','eduYear','value','name','position','phone','email'])if(typeof v[f]==='string')out[f]=v[f];out.level=Number.isInteger(v.level)&&v.level>=0&&v.level<=4?v.level:0;return out;});}return d;}
let restored=false;try{const saved=localStorage.getItem(KEY);if(saved){const x=JSON.parse(saved);data=normalize(x.data||x);ui=['ar','en','fr'].includes(x.ui)?x.ui:'ar';}else{const old=localStorage.getItem('cv_builder_data_v1');if(old){data=normalize(JSON.parse(old));restored=true;}}}catch(e){saveOK=false;}

function save(){try{localStorage.setItem(KEY,JSON.stringify({data,ui}));saveOK=true;}catch(e){saveOK=false;}$('#saved').textContent=t(saveOK?'saved':'saveError');updateProgress();clearTimeout(previewTimer);previewTimer=setTimeout(renderCV,170);}
function updateProgress(){const p=data.personal;const checks=[p.fullName.trim(),p.jobTitle.trim(),p.email.trim()||p.phone.trim(),p.summary.trim(),data.experience.some(v=>v.role||v.company),data.education.some(v=>v.degree||v.school),data.skills.some(v=>v.value)];const v=Math.round(checks.filter(Boolean).length/7*100);$('#percent').textContent=v+'%';$('#bar').style.width=v+'%';}

 function paginate(blocks,key){let pi=0,col=pages[0][key];const parse=html=>{const tmp=document.createElement('div');tmp.innerHTML=html;return tmp.firstElementChild;};const fits=()=>col.scrollHeight<=col.clientHeight+1;const advance=()=>{pi++;if(!pages[pi])makePage();col=pages[pi][key];};
